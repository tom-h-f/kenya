services:
  enrich:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    env_file: ../.env
    # Python block-buffers stdout to a pipe, so a freshly started container
    # shows NO logs until several KB accumulate - indistinguishable from a
    # stalled one. These are long-lived workers whose logs are the only
    # live signal; line-buffering costs nothing here.
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["--loop"]
    # --loop isolates each pass in its own subprocess, so only one model set is
    # resident at a time. The largest is the afro-xlmr-large hate model (~2GB
    # fp32); headroom for it + duckdb + a batch is why this is 6g, not 4g.
    # Needs HF_TOKEN in ../.env to pull the private hate model on first run.
    # Verify peak RSS on the deploy host and trim if it runs comfortably lower.
    mem_limit: 6g
    volumes:
      - hf_cache:/app/hf_cache   # transformer weights, downloaded once
    restart: unless-stopped

  # Coordination refresh only - no model passes. `kma.semantic` imports torch
  # lazily (inside `_model()`), and the default channels (co_retweet, co_reply)
  # never touch embeddings, so this loads nothing heavier than duckdb + igraph.
  # That makes it viable on a RAM-tight host where `enrich` is not, which
  # matters because the collector's `adaptive.cluster_accounts` and
  # `hate_signal.validated_peers` both read the LATEST persisted run - without
  # a scheduled refresh, cluster-based targeting freezes at whenever someone
  # last ran it by hand.
  #
  # Opt-in via profile so it does not start on hosts already running `enrich`:
  #   docker compose --profile coordination up -d coordination
  coordination:
    profiles: ["coordination"]
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    env_file: ../.env
    # Python block-buffers stdout to a pipe, so a freshly started container
    # shows NO logs until several KB accumulate - indistinguishable from a
    # stalled one. These are long-lived workers whose logs are the only
    # live signal; line-buffering costs nothing here.
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["--loop", "--no-embed", "--no-classify", "--no-hate", "--coord-hours", "6"]
    mem_limit: 2g
    restart: unless-stopped

volumes:
  hf_cache:
