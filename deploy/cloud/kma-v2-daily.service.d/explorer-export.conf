# Drop-in: build the explorer bundle after a SUCCESSFUL daily run, beside the
# dashboard summary. OnSuccess= is a list, so this adds to dashboard.conf and
# does not replace it. Delete this file to remove the explorer. A failure of the
# explorer unit does not mark the daily failed and does not touch its gauge, and
# the previous bundle stays live because the manifest is written last.
[Unit]
OnSuccess=kma-explorer-export.service
