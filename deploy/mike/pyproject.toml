[project]
name = "kenya-topics"
version = "0.1.0"
description = "Runtime for kma.topics_assign on mike-wsl: torch CUDA, no kma install."
requires-python = ">=3.12,<3.14"
dependencies = ["torch", "numpy", "pyarrow", "pandas", "duckdb", "python-dotenv"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
